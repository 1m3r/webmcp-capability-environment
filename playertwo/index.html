<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mirror — Player Two</title>
    <link rel="stylesheet" href="design-system/tokens.css">
    <link rel="stylesheet" href="app.css">
  </head>
  <body>
    <header class="bar">
      <h1 class="bar__mark">MIRROR</h1>
      <p class="bar__status">
        <span id="s-entry">no model context</span> ·
        <span id="s-tools" class="bar__tools">0 tools</span><span class="bar__instrument"> ·
        <span id="s-tier">no game</span> ·
        <span id="s-version">v0</span></span>
      </p>
    </header>

    <main id="stage" class="stage" aria-live="polite"></main>

    <aside class="panel">
      <div class="panel__controls">
        <button type="button" id="export" hidden>Export</button>
        <button type="button" id="abandon" hidden>Abandon sitting</button>
        <button type="button" id="games" hidden>Other games</button>
        <button type="button" id="forget" class="panel__instrument" hidden>Forget this portrait</button>
      </div>
      <p class="panel__note">
        The reveal, your response, the close and what your agent keeps are yours.
        It has no tool for any of them.
      </p>
      <h2 class="panel__title">Shared log</h2>
      <ol id="log" class="log"></ol>
    </aside>

    <script type="module" src="src/ui/shell.js"></script>
  </body>
</html>
